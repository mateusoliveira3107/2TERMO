<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icone Favorito -->
    <link rel="shortcut icon" href="Imagens\home.png" type="image/x-icon">
    <title>Favicons e Imagens</title>
</head>
<body >
    <h1 style="text-align: center; background-color: rgb(175, 173, 173);">Imagens do Google</h1>
    <div style="width: 630px;">
        <h2>Homem Aranha</h2>
        <!-- tag para acrescentar imagens - img -->
        <img src="Imagens/miranha.png"
        alt="imagem homem aranha"
        title="Homem aranha"
        align="left">

        <img src="Imagens/miranha.png"
        alt="imagem homem aranha"
        title="Homem aranha"
        align="left">

        <img src="Imagens/miranha.png"
        alt="imagem homem aranha"
        title="Homem aranha"
        align="center">
    </div>
    <hr>
    <div>
        <h2>Homem Aranha - com proporção de Imagens</h2>
        <img src="Imagens/miranha.jpg"
        alt="Homem aranha"
        title="Homem aranha"
        width="600px"
        height="400px"
        align="center"
        >
    </div>
    <hr>
    <h2>
        Homem Aranha - com proporção de imagens com style
    </h2>
    <div style="
    background-image: url(Imagens/miranha.png);
    background-repeat: repeat-x;
    background-size: auto;
    background-position: center;
    width: max-content; inline-size: auto;
    height: 250px">
    </div>

</body>
