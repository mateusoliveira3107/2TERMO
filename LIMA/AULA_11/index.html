    <title>CSS - Grid</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">

<body>

                <li>Grid 3</li>
                <li>Grid 4</li>

                <li>Grid 6</li>

    <main>
        <section>
            <ul class="grid-car">
                <li>Imagem 1</li>

                </li>

                <li>
                    <figure>
                        <img src="https://static.vecteezy.com/system/resources/thumbnails/060/359/186/small_2x/classic-turquoise-volkswagen-beetle-details-whitewall-tires-vintage-car-free-png.png" alt="Template de Grid do meu CSS">

                </li>

                <li>
                    <figure>
                        <img src="https://tse2.mm.bing.net/th/id/OIP.K1scnpz2UT5D0ylAUxLgbAHaEN?r=0&w=1650&h=939&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem de Grid do meu CSS em linhas">
                    </figure>

                <li>
                    <figure>
                        <img src="https://www.pngarts.com/files/8/Bugatti-Chiron-PNG-Image-Background.png" alt="Imagem de Grid do meu CSS em colunas">
                    </figure>
